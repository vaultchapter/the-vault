<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDAxN6lncX70JIc7ppxQRHMJK3zPtqiZ8o",
    authDomain: "fraternity-app-e9ff7.firebaseapp.com",
    databaseURL: "https://fraternity-app-e9ff7-default-rtdb.firebaseio.com",
    projectId: "fraternity-app-e9ff7",
    storageBucket: "fraternity-app-e9ff7.firebasestorage.app",
    messagingSenderId: "1012718155482",
    appId: "1:1012718155482:web:4181013c5f553707d2d7e3",
    measurementId: "G-WMHHYXRNRB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window._fbDb = db;
  window._fbRef = ref;
  window._fbSet = set;
  window._fbOnValue = onValue;

  const auth = getAuth(app);
  window._fbAuth = auth;
  window._fbSignInAnon = signInAnonymously;
  window._fbSignInEmail = signInWithEmailAndPassword;
  window._fbSignOut = signOut;

  onAuthStateChanged(auth, function(user) {
    if (window._onAuthChange) { window._onAuthChange(user); }
    else { window._pendingAuthUser = user; }
  });

  // Sign in anonymously by default so anyone can VIEW the app.
  // Officers log in separately (email/password) to unlock editing.
  signInAnonymously(auth).catch(function(e) { console.error('Anonymous sign-in failed:', e); });

  // Keys to sync
  const KEYS = ['members','events','dues','transactions','budget','fines','prospects','announcements','messages','chores','maintenance','settings','perfHistory','nid','studyHours','points','concessions','volunteers','soberDrivers','tkeWeek','nationalEvents','serviceHours','goals','receipts','library','serviceRequests','kra','riskMgmt','auditLog'];

  // Listen for changes from Firebase and update local state + re-render
  KEYS.forEach(function(k) {
    onValue(ref(db, 'chapter/' + k), function(snapshot) {
      var val = snapshot.val();
      if (val === null || val === undefined) return;
      // Update the in-memory variable
      if (k === 'nid') { window.nidVal = val; return; }
      if (k === 'messages') { window.messages = val; }
      else if (k === 'settings') { window.settings = val; }
      else if (k === 'perfHistory') { window.perfHistory = val; }
      else if (k === 'budget') { window.budget = val; }
      else if (k === 'members') { window.members = val; }
      else if (k === 'events') { window.events = val; }
      else if (k === 'dues') { window.dues = val; }
      else if (k === 'transactions') { window.transactions = val; }
      else if (k === 'fines') { window.fines = val; }
      else if (k === 'prospects') { window.prospects = val; }
      else if (k === 'announcements') { window.announcements = val; }
      else if (k === 'chores') { window.chores = val; }
      else if (k === 'maintenance') { window.maintenance = val; }
      else if (k === 'studyHours') { window.studyHours = val; }
      else if (k === 'points') { window.points = val; }
      else if (k === 'concessions') { window.concessions = val; }
      else if (k === 'volunteers') { window.volunteers = val; }
      else if (k === 'soberDrivers') { window.soberDrivers = val; }
      else if (k === 'tkeWeek') { window.tkeWeek = val; }
      else if (k === 'nationalEvents') { window.nationalEvents = val; }
      else if (k === 'serviceHours') { window.serviceHours = val; }
      else if (k === 'goals') { window.goals = val; }
      else if (k === 'receipts') { window.receipts = val; }
      else if (k === 'library') { window.library = val; }
      else if (k === 'serviceRequests') { window.serviceRequests = val; }
      else if (k === 'kra') { window.kra = val; }
      else if (k === 'riskMgmt') { window.riskMgmt = val; }
      else if (k === 'auditLog') { window.auditLog = val; }
      // Re-render current tab
      if (window.renderAll) window.renderAll();
      if (k === 'settings' && window.settings) {
        var el1 = document.getElementById('sb-chapter');
        var el2 = document.getElementById('sb-sub');
        if (el1) el1.textContent = window.settings.chapterName || 'The Vault';
        if (el2) el2.textContent = window.settings.semester || 'Fall 2026';
      }
    });
  });

  // Show a syncing indicator
  window._fbSyncing = false;
  window._showSync = function() {
    var el = document.getElementById('sync-status');
    if (el) { el.textContent = '⟳ Syncing...'; el.style.color = 'var(--amber)'; }
  };
  window._showSynced = function() {
    var el = document.getElementById('sync-status');
    if (el) { el.textContent = '✓ Synced'; el.style.color = 'var(--green)'; }
  };
</script>
